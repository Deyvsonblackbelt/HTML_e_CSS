<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 24</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }

        table{
            width: 600px;
            border-collapse: collapse;
            text-align: center;
        }

        th, td{
            border: 1px solid black;
            padding: 8px;
            
        }

        thead th{
            background-color:#555555;            
            color: white;
            font-weight: bold;
            
        }
        
        .area {
            font-weight: bold;
            color: black;
            background-color: #ffffff;
            vertical-align: middle;
            font-size: 18px;
        }

        /* Alinhamento dos nomes das disciplinas */
        .disciplina {
            text-align: left;
        }

        /* Estilo das linhas de Média Geral */
        .linha-media {
            background-color: #666666;
            color: white;
            font-weight: bold;
        }

        .linha-media th {
            text-align: left !important;
            background-color: #666666;
            color: white;
        }

        .linha-media td {
            text-align: center;
            font-weight: bold;
        }
       
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Diciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>

            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="4" class="area">Exatas</th>
                <td class="disciplina">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
                
            </tr>

            <tr>
                <td class="disciplina">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td class="disciplina">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td class="disciplina">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th class="linha-media" colspan="4">Média de Exatas</th>
                <td class="exatas">0.0</td>
            </tr>

            <tr>
                <th rowspan="2" class="area">Humanas</th>
                <td class="disciplina">História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>

            </tr>

            <tr>
                <td class="disciplina">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th class="linha-media" colspan="4">Média de Humanas</th>
                <td class="exatas">0.0</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
