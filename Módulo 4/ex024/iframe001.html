<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframes</title>
    <style>
        iframe {
            width: 300px;
            height: 200px;
            border: 1px solid #000;            
        }

        p{
            margin-bottom: 60px;
        }
    </style> 
</head>
<body>
    <h1>Testando o uso de Iframes</h1>
    <p>acessando o site do 
        
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" scrolling="yes"><a href="https://www.cursoemvideo.com/" target="_blank">Curso em Vídeo</a></iframe>              
        
        para aprender a programar
    </p>

    <p>
    
            o repositório do Guanabara
    
            <iframe src="https://gustavoguanabara.github.io/" frameborder="0" scrolling="no"><a href="https://gustavoguanabara.github.io/" target="_blank">Github</a></iframe>
    
            também é legal.
    </p>
</body>
</html>
