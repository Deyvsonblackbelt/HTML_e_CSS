<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.js" method="get">

        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="masc" value="Masculino">
            <label for="masc">Masculino</label>
            <input type="radio" name="sexo" id="fem" value="Feminino">
            <label for="fem">Feminino</label>
        </fieldset>

        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut" value="Futebol">
            <label for="iesfut">Futebol</label>
            <input type="checkbox" name="esbas" id="iesbas" value="Basquete">
            <label for="iesbas">Basquete</label>
            <input type="checkbox" name="esvolei" id="iesvolei" value="Vôlei">
            <label for="iesvolei">Vôlei</label>
            <input type="checkbox" name="esnat" id="iesnat" value="Natação">
            <label for="iesnat">Natação</label>
            <input type="checkbox" name="esoutros" id="iesoutros" value="Outros">
            <label for="iesoutros">Outros</label>
        </fieldset>
        
    </form>
    
</body>
</html>
