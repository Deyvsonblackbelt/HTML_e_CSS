<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        body{
            font-family:arial, helvetica, sans-serif;
        }

        table{

            width: 400px;
            height: 400px;
            border-collapse: collapse;
            border: 5px solid black;            
        }
        
        td{

            border: 1px solid black;
            padding: 8px;
            text-align: left; /*alinhamento horizontal*/
            vertical-align: top; /*alinhamento vertical*/            
        }

        .numero {
            text-align: right;
        }
       
    </style>
    
</head>
<body>

    <h1>Minha Primeira Tabela</h1>
    <table>
        <tr><!--primeira linha da tabela-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>

        </tr>

        <tr ><!--segunda linha da tabela-->
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>

        </tr>

        <tr>
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>

        </tr>

        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>

        </tr>        
    </table>
    
</body>
    
</html>
