<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.js" method="post" autocomplete="off">
        <p><label for="inome">Nome:</label> <input type="text" name="inome" id="inome" required minlength="2" maxlength="40" size="20"></p>
        <p><label for="isobrenome">Sobrenome:</label> <input type="text" name="isobrenome" id="isobrenome" required minlength="6" maxlength="10" size="10"></p>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
