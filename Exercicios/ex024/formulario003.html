<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.js" method="get" autocomplete="on" >

        <fieldset>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" required minlength="3" maxlength="30" size="30" autocomplete="name" placeholder="Nome completo">
            </p>
            <p>
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" required placeholder="Digite seu e-mail">
            </p>
            <p>
                <label for="telefone">Telefone:</label>
                <input type="tel" name="telefone" id="telefone" pattern="^\(d{2}\)\d{4,5}-\d{4}$" required placeholder="(xx) xxxx-xxxx">
            <p>
            
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>


    </form>
    
</body>
</html>
